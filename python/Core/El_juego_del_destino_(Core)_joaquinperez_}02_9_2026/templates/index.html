<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Juego del Destino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="fondo-estrellas"></div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="icono-circulo icono-luna">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </div>
                <h1>El Juego del Destino</h1>
                <p class="subtitulo">Descubre qué te depara el futuro</p>
            </div>

            <div class="card-body">
                <form action="/enviar" method="POST">
                    <div class="campo">
                        <label for="nombre">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            Tu nombre
                        </label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Jane" required>
                    </div>

                    <div class="campo">
                        <label for="edad">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            Tu edad
                        </label>
                        <input type="number" id="edad" name="edad" placeholder="Ej: 18" min="1" max="120" required>
                    </div>

                    <div class="campo">
                        <label for="color">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path><circle cx="6.5" cy="11.5" r="1.5"></circle><circle cx="9.5" cy="7.5" r="1.5"></circle><circle cx="14.5" cy="7.5" r="1.5"></circle><circle cx="17.5" cy="11.5" r="1.5"></circle></svg>
                            Tu color favorito
                        </label>
                        <input type="text" id="color" name="color" placeholder="Ej: rojo, azul, verde, morado, amarillo...">
                        <p class="hint">Ej: rojo, azul, verde, morado, amarillo...</p>
                    </div>

                    <div class="campo">
                        <label for="animal">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"></circle><circle cx="18" cy="8" r="2"></circle><circle cx="20" cy="16" r="2"></circle><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"></path></svg>
                            Tu animal favorito
                        </label>
                        <input type="text" id="animal" name="animal" placeholder="Ej: perro, gato, águila, león, delfín...">
                        <p class="hint">Ej: perro, gato, águila, león, delfín...</p>
                    </div>

                    <div class="orbe-contenedor">
                        <div class="orbe"></div>
                    </div>

                    <button type="submit" class="boton">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path><path d="m15 5 4 4"></path></svg>
                        Revelar mi destino
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
