<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon no encontrado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="pagina-error">
        <div class="mensaje-error-box">
            <h1 class="titulo-fallo">
                Oh no
            </h1>
            <p class="texto-error">
                {{ mensaje }}
            </p>
            <p class="alerta-error">
                Pokémon no encontrado
            </p>
            <p class="descripcion-error">
                Tal vez este Pokémon aún no ha sido descubierto,
                o quizás has escrito mal su nombre.
            </p>
            <a href="{{ url_for('ver_pokedex_completa') }}" class="boton-regresar">
                Volver a la Pokédex
            </a>
        </div>
    </main>
</body>

</html>
